name: Build Foundry Module Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: |
          zip -r mr-token-stage.zip module.json scripts styles lang assets README.md CHANGELOG.md LICENSE -x '*.DS_Store'
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mr-token-stage.zip
            module.json
          generate_release_notes: true
